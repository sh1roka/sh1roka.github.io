<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi pagina HTML</title>
</head>

<body>

    <h1>Test primera pagina</h1>

    <h2>Formulario</h2>

    <p>
        Solo HTML.
        No usa CSS ni JavaScript.
    </p>

    <hr>

    <h3>Datos personales</h3>

    <form>

        <label for="nombre">Nombre:</label>
        <br>
        <input type="text" id="nombre" name="nombre" placeholder="Escribi tu nombre">

        <br><br>

        <label for="email">Correo electrónico:</label>
        <br>
        <input type="email" id="email" name="email" placeholder="ejemplo@email.com">

        <br><br>

        <label for="edad">Edad:</label>
        <br>
        <input type="number" id="edad" name="edad">

        <br><br>

        <label for="pais">Pais:</label>
        <br>
        <select id="pais" name="pais">
            <option value="">Selecciona un pais</option>
            <option value="argentina">Argentina</option>
            <option value="uruguay">Uruguay</option>
            <option value="chile">Chile</option>
            <option value="brasil">Brasil</option>
        </select>

        <br><br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40"
                  placeholder="Escribi un mensaje..."></textarea>

        <br><br>

        <label>
            <input type="checkbox" name="terminos">
            Acepto los terminos y condiciones
        </label>

        <br><br>

        <button type="submit">Enviar formulario</button>

    </form>

    <hr>

    <h3>Lista de cosas que me gustan</h3>

    <ul>
        <li>Programar</li>
        <li>Jugar</li>
        <li>Escuchar musica</li>
    </ul>

</body>
</html>
